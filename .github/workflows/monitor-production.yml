name: Monitor Northflank production

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northflank-production-monitor
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # 期待版は公開中の Pages descriptor から決める。Repository variable による上書きは使わない。
      - name: Verify production release and content
        run: node scripts/monitor-production.mjs
      - name: Retain sanitized observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-health.json
          if-no-files-found: error
          retention-days: 7
