name: Deploy HoYoverse Builder to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# workflow全体は読取りだけ。Pagesへの書込みとOIDCはdeploy jobにだけ付ける。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build HoYoverse Builder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Confirm build job has no OIDC token access
        run: test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm は指摘検出時にも非ゼロで終わるため、保存した出力の内容でゲートが判定する（通信失敗は不合格）。
      - name: Audit production dependencies
        run: |
          pnpm audit --prod --json > audit.json || true
          node scripts/audit-gate.mjs audit.json

      - name: Run tests
        run: pnpm test

      - name: Validate content structure and generated UI
        run: pnpm content:check

      - name: Test Pages migration modes
        run: node --test scripts/pages.test.mjs scripts/wait-production-api.test.mjs scripts/verify-party-appearances.test.mjs

      - name: Test release descriptor and production monitor
        run: node --test scripts/monitor-production.test.mjs scripts/release-contract.test.mjs scripts/audit-gate.test.mjs

      - name: Type check
        run: pnpm check

      - name: Build API
        run: pnpm build:api

      - name: Wait for matching production API
        env:
          HOYOVERSE_PAGES_MODE: ${{ vars.HOYOVERSE_PAGES_MODE }}
          HOYOVERSE_NORTHFLANK_API_BASE_URL: ${{ vars.HOYOVERSE_NORTHFLANK_API_BASE_URL }}
        run: node scripts/wait-production-api.mjs

      - name: Build and verify Pages artifact
        env:
          HOYOVERSE_PAGES_MODE: ${{ vars.HOYOVERSE_PAGES_MODE }}
          HOYOVERSE_API_BASE_URL: ${{ vars.HOYOVERSE_API_BASE_URL }}
          HOYOVERSE_NORTHFLANK_API_BASE_URL: ${{ vars.HOYOVERSE_NORTHFLANK_API_BASE_URL }}
        run: node scripts/pages.mjs --verify

      # forward のときだけ公開版descriptorを生成し、他モードでは artifact から release.json を除く。
      - name: Generate release descriptor
        env:
          HOYOVERSE_PAGES_MODE: ${{ vars.HOYOVERSE_PAGES_MODE }}
        run: node --import tsx scripts/content/releaseManifest.ts

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages-artifact

  deploy:
    # job単位で権限を書くと未指定はnoneになるため、checkout用のcontents: readも再指定する。
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Recheck API immediately before publication
        env:
          HOYOVERSE_PAGES_MODE: ${{ vars.HOYOVERSE_PAGES_MODE }}
          HOYOVERSE_NORTHFLANK_API_BASE_URL: ${{ vars.HOYOVERSE_NORTHFLANK_API_BASE_URL }}
        run: node scripts/wait-production-api.mjs --check-once
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # 公開後の読み取り専用検査。descriptor が workflow 対象SHAを示し API と一致するまで最大120秒待つ。
      # 失敗時も自動revert・DB復元・期待版の書換えは行わない。
      - name: Verify published release
        if: vars.HOYOVERSE_PAGES_MODE == 'forward'
        run: node scripts/monitor-production.mjs --expect-revision "$GITHUB_SHA"
