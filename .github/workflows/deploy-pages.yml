name: Deploy HoYoverse Builder to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build HoYoverse Builder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Test Pages migration modes
        run: node --test scripts/pages.test.mjs

      - name: Type check
        run: pnpm check

      - name: Build API
        run: pnpm build:api

      - name: Build and verify Pages artifact
        env:
          HOYOVERSE_PAGES_MODE: ${{ vars.HOYOVERSE_PAGES_MODE }}
          HOYOVERSE_API_BASE_URL: ${{ vars.HOYOVERSE_API_BASE_URL }}
          HOYOVERSE_NORTHFLANK_API_BASE_URL: ${{ vars.HOYOVERSE_NORTHFLANK_API_BASE_URL }}
        run: node scripts/pages.mjs --verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
