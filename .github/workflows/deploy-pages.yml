name: Deploy HoYoverse Builder to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build HoYoverse Builder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type check
        run: pnpm check

      - name: Build API
        run: pnpm build:api

      - name: Verify Railway API
        env:
          API_BASE_URL: https://hoyoverse-builder-api-production.up.railway.app
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          health="$(mktemp)"
          trpc="$(mktemp)"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Origin: https://sitar-sitar.github.io" \
            -D "$headers" \
            "$API_BASE_URL/api/health" \
            -o "$health"
          grep -q '"ok":true' "$health"
          grep -qi '^access-control-allow-origin: https://sitar-sitar.github.io' "$headers"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Origin: https://sitar-sitar.github.io" \
            "$API_BASE_URL/api/trpc/build.guideHistory" \
            -o "$trpc"
          grep -q '"result"' "$trpc"

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.HOYOVERSE_API_BASE_URL || 'https://hoyoverse-builder-api-production.up.railway.app' }}
        run: pnpm exec vite build --config vite.pages.config.ts

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail

          # GitHub Pages does not provide SPA history fallback for nested paths.
          # Publish index.html at every known client-side route so direct links and
          # OAuth redirects such as /admin work without a Pages 404.
          for route in characters updates feedback admin admin/feedback; do
            mkdir -p "dist/public/$route"
            cp dist/public/index.html "dist/public/$route/index.html"
          done

          cp dist/public/index.html dist/public/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
