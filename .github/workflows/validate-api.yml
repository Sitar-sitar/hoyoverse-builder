name: Validate HoYoverse external API

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Test production monitor
        run: node --test scripts/monitor-production.test.mjs

      - name: Test Pages release gates
        run: node --test scripts/pages.test.mjs scripts/wait-production-api.test.mjs scripts/verify-party-appearances.test.mjs

      - name: Type check
        run: pnpm check

      - name: Build API
        run: pnpm build:api

      - name: Build Pages frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid
        run: pnpm exec vite build --config vite.pages.config.ts
