name: Validate HoYoverse external API

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm は指摘検出時にも非ゼロで終わるため、保存した出力の内容でゲートが判定する（通信失敗は不合格）。
      - name: Audit production dependencies
        run: |
          pnpm audit --prod --json > audit.json || true
          node scripts/audit-gate.mjs audit.json

      - name: Run tests
        run: pnpm test

      - name: Validate content structure and generated UI
        run: pnpm content:check

      - name: Test production monitor and release descriptor
        run: node --test scripts/monitor-production.test.mjs scripts/release-contract.test.mjs scripts/audit-gate.test.mjs

      - name: Test Pages release gates
        run: node --test scripts/pages.test.mjs scripts/wait-production-api.test.mjs scripts/verify-party-appearances.test.mjs

      - name: Type check
        run: pnpm check

      - name: Build API
        run: pnpm build:api

      - name: Build Pages frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid
        run: pnpm exec vite build --config vite.pages.config.ts
