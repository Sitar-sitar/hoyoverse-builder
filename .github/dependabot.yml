version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Phase 62で見送ったメジャー更新。ignoreはsecurity updatesにも効くが、修正は通常同じメジャー内で出る。
    # wouter（patches/wouter@3.7.1.patch）とesbuild（0.x）はignoreせずグループから外し、単独PRで判断する。
    # 設計: docs/修正設計書_開発依存の脆弱性解消とDependabot整理_2026-10-21.md §4.3
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-ui:
        patterns:
          - "react"
          - "react-dom"
          - "@radix-ui/*"
          - "react-hook-form"
          - "@hookform/*"
          - "next-themes"
          - "lucide-react"
          - "sonner"
          - "vaul"
          - "cmdk"
          - "embla-carousel-react"
          - "react-day-picker"
          - "react-resizable-panels"
          - "input-otp"
          - "tailwind-merge"
          - "tailwindcss-animate"
          - "class-variance-authority"
          - "clsx"
          - "date-fns"
        update-types:
          - "minor"
          - "patch"
      api-backend:
        patterns:
          - "@trpc/*"
          - "zod"
          - "express"
          - "jose"
          - "cookie"
          - "superjson"
          - "axios"
          - "dotenv"
        update-types:
          - "minor"
          - "patch"
      database:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
          - "mysql2"
        update-types:
          - "minor"
          - "patch"
      tooling:
        patterns:
          - "vite"
          - "vite-plugin-*"
          - "@vitejs/*"
          - "vitest"
          - "typescript"
          - "prettier"
          - "@types/*"
          - "@tailwindcss/*"
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
          - "@testing-library/*"
          - "jsdom"
          - "tsx"
          - "tw-animate-css"
          - "pnpm"
        update-types:
          - "minor"
          - "patch"
