version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-ui:
        patterns:
          - "react"
          - "react-dom"
          - "@radix-ui/*"
          - "framer-motion"
          - "react-hook-form"
          - "@hookform/*"
          - "recharts"
          - "wouter"
          - "next-themes"
          - "lucide-react"
          - "sonner"
          - "vaul"
          - "cmdk"
          - "embla-carousel-react"
          - "react-day-picker"
          - "react-resizable-panels"
          - "input-otp"
          - "tailwind-merge"
          - "tailwindcss-animate"
          - "class-variance-authority"
          - "clsx"
          - "date-fns"
        update-types:
          - "minor"
          - "patch"
      api-backend:
        patterns:
          - "@trpc/*"
          - "zod"
          - "express"
          - "jose"
          - "cookie"
          - "superjson"
          - "nanoid"
          - "axios"
          - "dotenv"
        update-types:
          - "minor"
          - "patch"
      database:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
          - "mysql2"
        update-types:
          - "minor"
          - "patch"
      aws:
        patterns:
          - "@aws-sdk/*"
        update-types:
          - "minor"
          - "patch"
      tooling:
        patterns:
          - "vite"
          - "vite-plugin-*"
          - "@vitejs/*"
          - "vitest"
          - "esbuild"
          - "typescript"
          - "prettier"
          - "@types/*"
          - "@tailwindcss/*"
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
          - "@testing-library/*"
          - "jsdom"
          - "tsx"
          - "tw-animate-css"
          - "pnpm"
        update-types:
          - "minor"
          - "patch"
